---
- name: Prepare Oracle 19c Database Prerequisites
  hosts: oracledb
  become: yes
  vars_files:
    - files/oracle.yml
  tasks:
    - name: Install prerequisite packages
      loop: "{{ oracle_packages }}"
      dnf:
        name: "{{ item }}"
        state: present

    - name: Create Oracle groups
      group:
        name: "{{ item }}"
        state: present
      loop: "{{ oracle_groups }}"

    - name: Create Oracle user
      user:
        name: "{{ oracle_user }}"
        groups: "{{ oracle_groups | join(',') }}"
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Create Oracle directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ oracle_user }}"
        group: "{{ oracle_groups[0] }}"
        mode: '0775'
      loop: "{{ oracle_directories }}"

    - name: Set kernel parameters
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: yes
        reload: yes
      loop: "{{ kernel_params | dict2items }}"

    - name: Configure Oracle user limits
      copy:
        dest: /etc/security/limits.d/oracle.conf
        content: |
          oracle   soft   nofile    1024
          oracle   hard   nofile    65536
          oracle   soft   nproc     16384
          oracle   hard   nproc     16384
          oracle   soft   stack     10240
          oracle   hard   stack     32768
          oracle   soft   memlock   134217728
          oracle   hard   memlock   134217728
        owner: root
        group: root
        mode: '0644'

    - name: Disable Transparent Huge Pages (THP)
      lineinfile:
        path: /etc/default/grub
        regexp: '(^GRUB_CMDLINE_LINUX=.*)'
        line: '\1 transparent_hugepage=never'
        backrefs: yes
      notify: Update grub

    - name: Open Oracle listener port (1521)
      firewalld:
        port: 1521/tcp
        permanent: yes
        state: enabled
        immediate: yes

  handlers:
    - name: Update grub
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
