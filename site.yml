---
- name: Configure OracleDB web servers
  hosts: oracledb
  become: true
  vars_files:
    - files/vars.yml
  tasks:
    - name: Ensure {{ apache_server }} package is installed
      ansible.builtin.dnf:
        name: "{{ apache_server }}"
        state: present

    - name: Copy index.html to web root
      ansible.builtin.copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'

    - name: Ensure httpd service is started and enabled
      ansible.builtin.service:
        name: "{{ apache_server }}"
        state: started
        enabled: true

    - name: Open HTTP port 80 in the firewall permanently
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true

- name: Test intranet web server
  hosts: oracledb
  become: false
  tasks:
    - name: Connect to intranet web server
      ansible.builtin.uri:
        url: http://oracledb.example.com
        return_content: yes
        status_code: 200